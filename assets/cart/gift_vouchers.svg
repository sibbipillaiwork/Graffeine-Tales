<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="ticketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA580C"/>
      <stop offset="40%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#E11D48"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED"/>
      <stop offset="100%" stop-color="#FFEDD5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.12"/>
    </filter>
  </defs>
  
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)"/>
  
  <!-- Ticket Card Body -->
  <g filter="url(#shadow)">
    <rect x="35" y="60" width="330" height="280" rx="18" fill="url(#ticketGrad)"/>
    
    <!-- Left \u0026 Right Ticket Notches -->
    <circle cx="35" cy="200" r="20" fill="url(#bgGrad)"/>
    <circle cx="365" cy="200" r="20" fill="url(#bgGrad)"/>
    
    <!-- Dashed separator line between notches -->
    <line x1="65" y1="200" x2="335" y2="200" stroke="#FED7AA" stroke-width="2" stroke-dasharray="6,6"/>
  </g>
  
  <!-- Icon & Header -->
  <text x="200" y="125" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" text-anchor="middle">🎟️</text>
  <text x="200" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" text-anchor="middle" fill="#FFFFFF" letter-spacing="0.5">₹1,900 VOUCHERS</text>
  <text x="200" y="185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle" fill="#FFEDD5">PREMIUM BRAND REWARDS</text>
  
  <!-- Partner Brand Logos / Tags -->
  <rect x="75" y="225" width="70" height="24" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <text x="110" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#EA580C">NYKAA</text>
  
  <rect x="160" y="225" width="75" height="24" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <text x="197" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#E11D48">MYNTRA</text>
  
  <rect x="250" y="225" width="75" height="24" rx="12" fill="#FFFFFF" opacity="0.95"/>
  <text x="287" y="241" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="bold" text-anchor="middle" fill="#D97706">SWIGGY</text>
  
  <rect x="100" y="275" width="200" height="32" rx="16" fill="#FFFFFF"/>
  <text x="200" y="296" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" text-anchor="middle" fill="#C2410C">FREE TIER 2 GIFT</text>
</svg>
